name: GM-I-C IC3 Drive Ingress Tests

on:
  pull_request:
    paths:
      - "src/drive_ingress.py"
      - "tests/test_drive_ingress.py"
      - ".github/workflows/drive_ingress.yml"
      - ".github/workflows/drive_ingress_tests.yml"
  push:
    branches: [main]
    paths:
      - "src/drive_ingress.py"
      - "tests/test_drive_ingress.py"
      - ".github/workflows/drive_ingress.yml"
      - ".github/workflows/drive_ingress_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-drive-ingress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Drive ingress contract tests
        run: python -m pytest -q tests/test_drive_ingress.py

      - name: State authority boundary
        run: |
          echo "PASS here proves only local ingress contract behavior."
          echo "It does not prove IC3 Google WIF, Drive ACL, or hosted Drive API access."
