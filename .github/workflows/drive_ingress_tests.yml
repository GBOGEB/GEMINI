name: GM-I-C Ingress and Handover Contract Tests

on:
  pull_request:
    paths:
      - "src/drive_ingress.py"
      - "tests/test_drive_ingress.py"
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
      - ".github/workflows/drive_ingress.yml"
      - ".github/workflows/drive_ingress_tests.yml"
  push:
    branches: [main]
    paths:
      - "src/drive_ingress.py"
      - "tests/test_drive_ingress.py"
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
      - ".github/workflows/drive_ingress_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-drive-ingress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Drive ingress contract tests
        run: python -m pytest -q tests/test_drive_ingress.py

      - name: State authority boundary
        run: |
          echo "PASS here proves only local ingress contract behavior."
          echo "It does not prove IC3 Google WIF, Drive ACL, or hosted Drive API access."

  test-gmi-handover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Compile governed handover surfaces
        run: python -m py_compile src/handover_package.py src/handover_batch.py src/handover_binding.py

      - name: Run fail-closed package batch and binding matrix
        run: >
          python -m pytest -q
          tests/test_handover_package.py
          tests/test_handover_batch.py
          tests/test_handover_binding.py

      - name: State authority boundary
        run: |
          echo "PASS proves local fail-closed handover parsing/batch/binding behavior only."
          echo "It does not prove IC3 Google auth, physical bundle return, or engineering acceptance."
