name: Generate Code-Driven BLSN Reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-matrix-validation:
    name: Run (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.telemetry == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "pypy-3.9"
            telemetry: true
          - os: ubuntu-latest
            python-version: "3.13-dev"
            telemetry: true
          - os: ubuntu-latest
            python-version: "3.14-dev"
            telemetry: true

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install image-lib system deps (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install Core & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: Pillow || true
          pip install pytest pytest-json-report ruff yamllint pyyaml fpdf2 plotly pandas

      - name: Data Substrate Linting (YAML & JSON)
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: |
          echo "=== YAML LINTING ==="
          yamllint config/blsn_config.yaml -d "{extends: default, rules: {line-length: disable}}"
          echo "=== JSON LINTING ==="
          find . -name "*.json" -print0 | xargs -0 -r -I {} python -m json.tool {} > /dev/null
          echo "--> All YAML and JSON substrates structurally validated."

      - name: Python Linting (Ruff Check)
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: ruff check .

      - name: Technical Debt Radar (Ruff 3.12 Upgrade Check)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          echo "=== TECHNICAL DEBT REPORT ==="
          ruff check . --select UP --target-version py312 --output-format=github || true

      - name: Logic Validation & Speed Telemetry (Pytest)
        id: runtime_test
        continue-on-error: ${{ matrix.python-version != '3.9' || matrix.os != 'ubuntu-latest' }}
        run: |
          mkdir -p docs
          pytest -v --json-report --json-report-file=docs/pytest_telemetry.json --durations=0

      - name: Parse DMAIC KPI Dashboard
        if: always() && matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: python src/telemetry_parser.py

      - name: Archive Pytest Telemetry Payload
        if: always() && matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-telemetry-json
          path: docs/pytest_telemetry.json
          if-no-files-found: warn

      - name: Execute Idempotent BLSN Engine
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: python -m src.pipeline

      - name: Build Repository Indexes
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: python src/indexer.py

      - name: Run Federation Artifact Bridge
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/federation_bridge.py

      - name: Build Statistical Engine
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: python src/stats_engine.py

      - name: Build Bradley-Terry Ranking
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: python src/bt_ranking.py

      - name: Build Jekyll Data Bridge
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        run: python src/jekyll_bridge.py

      - name: Archive Engineering Outputs
        if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blsn-docs-and-charts
          path: docs/

  # JADE deploy contract (option A): the hub reusable CI runs the test suite, then
  # regenerates docs/ exactly as the old deploy-pages job did and builds it with the
  # same Jekyll image actions/jekyll-build-pages@v1 runs, hashes every file into
  # jade-manifest.json and uploads the artefact once. The hub reusable deploy
  # promotes that artefact by digest and reads the served files back.
  ci:
    name: JADE CI (tests, build once, hash)
    uses: GBOGEB/pipeline-automation-hub/.github/workflows/jade-reusable-ci.yml@77bac410de6b34afa5df665608611ad9e8db5c84
    with:
      python-version: '3.12'
      install: python -m pip install --disable-pip-version-check pytest pyyaml fpdf2 plotly numpy
      test-runner: pytest
      test-args: -q -p no:cacheprovider tests
      min-tests: 50
      build-command: |
        python -m src.pipeline
        python src/stats_engine.py
        python src/indexer.py
        python src/bt_ranking.py
        python src/jekyll_bridge.py
        docker run --rm -v "$PWD:/github/workspace" -w /github/workspace           -e GITHUB_WORKSPACE=/github/workspace -e INPUT_SOURCE=docs -e INPUT_DESTINATION=_site           -e INPUT_BUILD_REVISION="$GITHUB_SHA" -e INPUT_VERBOSE=false -e INPUT_FUTURE=false -e INPUT_TOKEN=""           -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" -e GITHUB_API_URL="$GITHUB_API_URL"           ghcr.io/actions/jekyll-build-pages@sha256:6791ebfd912185ed59bfb5fb102664fa872496b79f87ff8b9cfba292a7345041
        sudo chown -R "$(id -u):$(id -g)" _site
        find _site -name '.*' -prune -exec rm -rf {} +
        test -f _site/index.html
      artifact-path: _site
      artifact-name: gemini-pages

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [ci, full-matrix-validation]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: GBOGEB/pipeline-automation-hub/.github/workflows/jade-reusable-deploy.yml@77bac410de6b34afa5df665608611ad9e8db5c84
    with:
      environment: production
      target: pages
      artifact-name: ${{ needs.ci.outputs.artifact-name }}
      manifest-sha256: ${{ needs.ci.outputs.manifest-sha256 }}
      tests-ran: ${{ fromJSON(needs.ci.outputs.tests-ran) }}
