name: GMI Handover Fail-Closed Tests

on:
  pull_request:
    paths:
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
      - ".github/workflows/gmi_handover_tests.yml"
  push:
    branches: [main]
    paths:
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Compile governed handover surfaces
        run: python -m py_compile src/handover_package.py src/handover_batch.py src/handover_binding.py

      - name: Run package batch and binding negative matrix
        run: >
          python -m pytest -q
          tests/test_handover_package.py
          tests/test_handover_batch.py
          tests/test_handover_binding.py

      - name: State authority boundary
        run: |
          echo "PASS proves fail-closed handover parsing/batch/binding behavior only."
          echo "It does not prove IC3 Google auth, physical bundle return, or engineering acceptance."
