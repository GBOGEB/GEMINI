name: GMI Handover Fail-Closed Tests

on:
  pull_request:
    paths:
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
      - ".github/workflows/gmi_handover_tests.yml"
  push:
    branches: [main]
    paths:
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
      - ".github/workflows/gmi_handover_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Execute package, batch and binding regression matrix
        run: |
          python -m pytest -q \
            tests/test_handover_package.py \
            tests/test_handover_batch.py \
            tests/test_handover_binding.py

      - name: State authority boundary
        run: |
          echo "PASS proves local GMI handover fail-closed behavior only."
          echo "IC3 Google auth/ACL and physical successor bundle remain independent."
          echo "authority_transfer=false; formal_credit_delta=0"
