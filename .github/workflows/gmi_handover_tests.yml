name: GMI Handover Fail-Closed Tests

on:
  pull_request:
    paths:
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "src/proposal_broker.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
      - "tests/test_proposal_broker.py"
      - "docs/bridge/PROPOSAL_BROKER.md"
      - ".github/workflows/gmi_handover_tests.yml"
  push:
    branches: [main]
    paths:
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/handover_binding.py"
      - "src/proposal_broker.py"
      - "tests/test_handover_package.py"
      - "tests/test_handover_batch.py"
      - "tests/test_handover_binding.py"
      - "tests/test_proposal_broker.py"
      - ".github/workflows/gmi_handover_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Compile guarded components
        run: python -m py_compile src/handover_package.py src/handover_batch.py src/handover_binding.py src/proposal_broker.py

      - name: Execute handover and proposal broker regression matrix
        run: |
          python -m pytest -q \
            tests/test_handover_package.py \
            tests/test_handover_batch.py \
            tests/test_handover_binding.py \
            tests/test_proposal_broker.py

      - name: State authority boundary
        run: |
          echo "PASS proves offline GMI package and proposal-broker behavior only."
          echo "IC3 Drive authentication, hosted bridge dispatch and native owner approval remain unverified."
          echo "authority_transfer=false; formal_credit_delta=0"
