name: GM-I-C R2-W2 Proposal Broker Tests

on:
  pull_request:
    paths:
      - "src/proposal_broker.py"
      - "src/repo_snapshot.py"
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/drive_materialize.py"
      - "tests/test_proposal_broker.py"
      - "docs/bridge/PROPOSAL_BROKER.md"
      - ".github/workflows/proposal_broker_tests.yml"
  push:
    branches: [main]
    paths:
      - "src/proposal_broker.py"
      - "src/repo_snapshot.py"
      - "src/handover_package.py"
      - "src/handover_batch.py"
      - "src/drive_materialize.py"
      - "tests/test_proposal_broker.py"
      - ".github/workflows/proposal_broker_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-proposal-broker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Run broker contract and adversarial tests
        run: python -m pytest -q tests/test_proposal_broker.py tests/test_handover_batch.py tests/test_repo_snapshot.py

      - name: State authority boundary
        run: |
          echo "PASS here proves only the offline gmi.proposal_profile.v1 broker (dry run)."
          echo "It does not prove IC3 Google WIF, an IC7 hosted round trip, any push, PR or Drive write."
